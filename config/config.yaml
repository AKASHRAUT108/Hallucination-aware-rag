paths:
  raw_dir: data/raw
  processed_dir: data/processed
  chunks_file: data/processed/chunks.jsonl
  index_file: data/processed/index.faiss

chunking:
  chunk_size: 200     # words per chunk
  overlap: 40         # words shared between neighbouring chunks
  min_chunk_words: 30 # drop tiny leftovers

retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
  top_k: 5            # passages sent to the generator

reranking:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  fetch_k: 20         # candidates pulled from FAISS before reranking
  top_n: 5            # passages kept after reranking

generation:
  backend: hf_causal                  # hf_causal | hf_seq2seq | anthropic
  model: Qwen/Qwen2.5-1.5B-Instruct   # lighter option: backend hf_seq2seq + model google/flan-t5-base
  anthropic_model: claude-haiku-5-5   # only used when backend is anthropic
  max_new_tokens: 128
  max_passages: 3                     # passages shown to the generator

pipeline:
  abstain_message: "I can't answer this reliably from the available documents."
  refusal_phrases:
    - "i don't know"
    - "i do not know"
    - "cannot answer"
    - "can't answer"
    - "not mentioned"

verification:
  nli_model: cross-encoder/nli-deberta-v3-small
  batch_size: 16
  citation_threshold: 0.5
  weights:
    retrieval: 0.2
    entailment: 0.5
    citation: 0.3
  entailment_aggregation: mean
  confidence_threshold: 0.6
